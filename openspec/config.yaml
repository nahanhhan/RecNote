schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  开发规矩：
  - GitHub 默认分支为最新版；每次功能开发或 debug SHALL 先检查云端更新并安全同步。提交上传前 SHALL 再检查，保留其他成员修改，MUST NOT 用旧本地版本覆盖或强制推送。
  - Kotlin/Android 验证由 CI 承担（执行 :core:test、:app:testDebugUnitTest、:app:compileDebugAndroidTestKotlin、:app:lintDebug、:app:assembleDebug 并上传测试报告与 APK）；端侧 MUST NOT 要求 Kotlin/JDK/Android SDK 环境，验证结论以 CI 结果为准。仪器测试源码编译不代表测试已在设备执行。
  - 端侧提交前自检：在 scripts/tests 下执行 `uv run python -m checks` 单命令（只读、不修改被检查文件；失败以非零退出码并列出失败项与文件）。OpenSpec 工件校验用 openspec 官方命令，MUST NOT 重复实现。
  - 端侧 Python 验证一律经 uv 执行（`uv run python ...`），MUST NOT 裸跑系统 Python；验证脚本统一收于 scripts/tests（仓库唯一 uv 源）。
  - 任务 SHALL 按可独立验证的小批次组织，每批以对应 CI 通过作为验收；MUST NOT 要求验收者本机具备 Kotlin/Android 环境。
  - CI 通过仅表述为工程验证（编译、测试、lint）通过，MUST NOT 呈现为真机发布验收通过；真机验收由各 change 的 tasks.md 人工勾选执行。
  - 夹具同步：开发规范变更 SHALL 同批同步本 context，新增验证测试 SHALL 同批注册进 scripts/tests 的 `uv run python -m checks` 检查清单；及时落地，MUST NOT 事后补写或遗漏。
  - README 仅在存在需要通知用户的行为或约定变化时才改动；检查项增减、内部实现调整 MUST NOT 触发 README 改动。
  - WebDAV 凭据 MUST 本机加密保存且任何日志档位均不可输出；同步测试只用合成资料与模拟服务。导入音频的笔记同步 MUST 仅发送文字笔记，不允许图文混合流程。用户显式开启的远程转写音频中转 SHALL 使用独立任务目录与明确配置生命周期，原始音频 MUST NOT 混入笔记同步任务。
  - 远程转写 SHALL 按用户约定使用约 30 秒音频块经云盘中转、电脑主动轮询下载；公开电脑 API 只承载鉴权、开始/结束通知和状态/文字，不上传音频本体。云盘实际上传/下载入口 SHALL 核实是否绕开预期 cloudflared 链路。结束通知 SHALL 触发收尾，最终清单中的全部块完成才可停止任务；任务凭据 SHALL 区分每次录音并保护两台手机的会话隔离。
  - 远程模式手机 SHALL 只封存大切片，按句切分交给 Voice2Note；电脑 SHALL 将完整大切片原稿回写 start 云盘路径下的 `.transcripts/`，手机进入详情查询完成结果。电脑 MUST 只做 ASR，服务 `config.yaml` 只含 ASR 与必需的服务／OpenList 配置；LLM 整理 SHALL 沿用手机既有供应商配置、提示词、读图与手动发起流程，云端笔记整理设置在两种识别模式下均保留。
  - Debug 请求日志 MUST 省略 system/developer 消息正文；新增系统提示词配置及变量测试 MUST 使用合成内容，不打印或提交真实凭据。
  - PDF 与持久状态的运行验证 SHALL 在 CI 的 x86_64 隔离模拟器执行（应用包名 .uitest），上传合成 PDF/页面图片及报告；模拟器验证 MUST NOT 表述为用户手机、原生相机厂商行为或真实网盘验收。

