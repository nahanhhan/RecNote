schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  开发规矩：
  - GitHub 默认分支为最新版；每次功能开发或 debug SHALL 先检查云端更新并安全同步。提交上传前 SHALL 再检查，保留其他成员修改，MUST NOT 用旧本地版本覆盖或强制推送。
  - Kotlin/Android 验证由 CI 承担（执行 :core:test、:app:testDebugUnitTest、:app:compileDebugAndroidTestKotlin、:app:lintDebug、:app:assembleDebug 并上传测试报告与 APK）；端侧 MUST NOT 要求 Kotlin/JDK/Android SDK 环境，验证结论以 CI 结果为准。仪器测试源码编译不代表测试已在设备执行。
  - 端侧提交前自检：在 scripts/tests 下执行 `uv run python -m checks` 单命令（只读、不修改被检查文件；失败以非零退出码并列出失败项与文件）。OpenSpec 工件校验用 openspec 官方命令，MUST NOT 重复实现。
  - 端侧 Python 验证一律经 uv 执行（`uv run python ...`），MUST NOT 裸跑系统 Python；验证脚本统一收于 scripts/tests（仓库唯一 uv 源）。
  - 任务 SHALL 按可独立验证的小批次组织，每批以对应 CI 通过作为验收；MUST NOT 要求验收者本机具备 Kotlin/Android 环境。
  - CI 通过仅表述为工程验证（编译、测试、lint）通过，MUST NOT 呈现为真机发布验收通过；真机验收由各 change 的 tasks.md 人工勾选执行。
  - 夹具同步：开发规范变更 SHALL 同批同步本 context，新增验证测试 SHALL 同批注册进 scripts/tests 的 `uv run python -m checks` 检查清单；及时落地，MUST NOT 事后补写或遗漏。
  - README 仅在存在需要通知用户的行为或约定变化时才改动；检查项增减、内部实现调整 MUST NOT 触发 README 改动。
  - WebDAV 凭据 MUST 本机加密保存且任何日志档位均不可输出；同步测试只用合成资料与模拟服务。导入音频的笔记同步 MUST 仅发送文字笔记，不允许图文混合流程。用户显式开启的远程转写音频中转 SHALL 使用独立任务目录与明确配置生命周期，原始音频 MUST NOT 混入笔记同步任务。
  - WebDAV 连接测试 SHALL 显示失败阶段及安全的网络错误分类，并在 Info/Debug 日志记录阶段、固定分类及状态码；MUST NOT 记录地址、文件夹、账号、原始异常消息或服务端正文。暂时网络失败保留既有限次重试，证书与系统权限错误不自动重试，不自动降级 HTTPS 或跳过证书校验。电脑控制接口的非 JSON 网关错误 SHALL 给出服务与转发检查提示，仍不得按 HTTP 状态猜测协议 retryable。
  - 远程转写 SHALL 按用户约定使用约 30 秒音频块经云盘中转、电脑主动轮询下载；公开电脑 API 只承载鉴权、开始/结束通知和状态/文字，不上传音频本体。云盘实际上传/下载入口 SHALL 核实是否绕开预期 cloudflared 链路。结束通知 SHALL 触发收尾，最终清单中的全部块完成才可停止任务；任务凭据 SHALL 区分每次录音并保护两台手机的会话隔离。
  - 远程模式手机 SHALL 只封存大切片，按句切分交给 Voice2Note；电脑 SHALL 将完整大切片原稿回写 start 云盘路径下的 `.transcripts/`，手机进入详情查询完成结果。电脑 MUST 只做 ASR，服务 rec-daemon.yaml 独立于批处理 config.yaml，由电脑维护识别运行环境、服务／OpenList／队列／限制及工作目录；手机不传递电脑模型配置。LLM 整理 SHALL 沿用手机既有供应商配置、提示词、读图与手动发起流程，云端笔记整理设置在两种识别模式下均保留。
  - 本轮远程改造只实施 RecNote；电脑服务作为外部协议对端，用合成模拟服务验证手机行为，Voice2Note 代码改造与实际双方联调后续进行。远程凭据与日志边界自检 SHALL 注册到统一 checks 的 remote_safety 项。
  - 远程模式 SHALL 使用 `RemoteTrace` 记录连接探测、云盘传输与电脑识别状态。日志仅记录脱敏编号、固定事件与状态、数值和受限错误码，不记录地址、路径、账号、凭据、原始异常消息、音频或原稿正文。
  - 远程契约 SHALL 对齐用户提供的 RecNote-Sync.md：路径统一相对云盘根，音频条目无 bytes，状态完成值为 completed，probe 使用 path 且手机回读带摘要回执；控制错误按 retryable 决策，取消清理电脑本地且删除后仍保留取消待发送记录，云盘保留。
  - 精确字段 SHALL 对照 Voice2Note 7dd3e1d3c88fdf25e67954a91ac7e3eedcfc206a 的四份 protocol_v1 原 JSON 与字段说明，原字节复制并以 Kotlin 断言摘要、字段集合及往返；health 为 storage_ready，probe 包含 protocol_version=1，结果索引无 bytes 且仅 completed/failed，完成条目仅 sequence/audio_sha256/path/sha256。回执字段按同提交 storage.py 固定为 protocol_version/probe_path/probe_sha256/asr_ready/timestamp，时间为 UTC 秒精度，MUST 逐字段核对。
  - Debug 请求日志 MUST 省略 system/developer 消息正文；新增系统提示词配置及变量测试 MUST 使用合成内容，不打印或提交真实凭据。
  - PDF 与持久状态的运行验证 SHALL 在 CI 的 x86_64 隔离模拟器执行（应用包名 .uitest），上传合成 PDF/页面图片及报告；模拟器验证 MUST NOT 表述为用户手机、原生相机厂商行为或真实网盘验收。

