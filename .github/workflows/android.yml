name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare sherpa runtime
        run: python scripts/bootstrap.py --native
      - name: Guard static debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "::error::Missing static debug.keystore at repo root. Run the 'Init debug keystore' workflow once to create it."
            exit 1
          fi
      - name: Verify and build
        run: |
          chmod +x gradlew
          python -m unittest discover -s scripts/tests
          ./gradlew :core:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: lecture-recording-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  runtime_verify:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated x86 runtime
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          python scripts/bootstrap.py --native --abi x86_64
          chmod +x gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify PDF and persistent state on isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest -PisolatedTest -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=io.github.nahanhhan.lecturerecording.PdfExportTest,io.github.nahanhhan.lecturerecording.NoteRecoveryTest,io.github.nahanhhan.lecturerecording.NativePhotoAndModelTest,io.github.nahanhhan.lecturerecording.WebDavSettingsTest,io.github.nahanhhan.lecturerecording.DatabaseMigrationTest --console=plain
            runtime_result=$?
            mkdir -p runtime-artifacts
            adb pull /sdcard/Android/data/io.github.nahanhhan.lecturerecording.uitest/files/verification runtime-artifacts
            exit "$runtime_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-runtime-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            runtime-artifacts/
